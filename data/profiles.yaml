heading: "Supported Profiles"
intro: |
  **Lower level host stack:** GAP, L2CAP (Basic, ERTM and LE credit-based channels), SDP, RFCOMM, ATT/GATT (including Enhanced ATT), SMP and isochronous channels, with support for Core Specification features up to [6.0](https://www.bluetooth.com/specifications/specs/core-specification-6-0/).

  **Audio:** [PipeWire](https://pipewire.org/) provides the endpoints and codecs for A2DP and LE Audio, and implements the HFP and HSP roles.
notes:
  - tag: "experimental"
    text: "Complete enough to use and built by default, but only registered when experimental profiles are enabled. The D-Bus API it exposes is not yet frozen and may still change."
  - tag: "testing"
    text: "Work in progress. Intended for development and interoperability testing rather than for general use."
verified:
  bluez: "ed3d4c3f91b2a1a73ff8b8ffc6a1e83d34488dfd"
  pipewire: "b0b792fa72451fd9a068c1a8f877d21d4c67cd3f"
categories:
  - name: "Audio & video (BR/EDR)"
    items:
      - abbr: "A2DP"
        version: "1.4"
        full: "Advanced Audio Distribution Profile"
        roles: "Source, Sink"
        codecs: [SBC, AAC, aptX, FastStream, LDAC, LHDC, Opus, Opus 05, LC3plus]
        url: "https://www.bluetooth.com/specifications/specs/advanced-audio-distribution-profile-1-4/"
      - abbr: "AVRCP"
        version: "1.6"
        full: "Audio/Video Remote Control Profile"
        roles: "Controller, Target"
        note: "browsing and cover art"
        url: "https://www.bluetooth.com/specifications/specs/a-v-remote-control-profile-1-6-2/"
      - abbr: "AVDTP"
        version: "1.3"
        full: "Audio/Video Distribution Transport Protocol"
        roles: "Initiator, Acceptor"
        url: "https://www.bluetooth.com/specifications/specs/a-v-distribution-transport-protocol-1-3/"
      - abbr: "AVCTP"
        version: "1.4"
        full: "Audio/Video Control Transport Protocol"
        roles: "Initiator, Acceptor"
        url: "https://www.bluetooth.com/specifications/specs/a-v-control-transport-protocol-1-4/"
      - abbr: "HFP"
        version: "1.8"
        full: "Hands-Free Profile"
        roles: "HF, AG"
        codecs: [CVSD, mSBC, LC3-SWB, LC3-24kHz]
        note: "built-in HF is experimental; PipeWire implements both roles and advertises 1.9"
        url: "https://www.bluetooth.com/specifications/specs/hands-free-profile-1-8/"
      - abbr: "HSP"
        version: "1.2"
        full: "Headset Profile"
        roles: "HS, AG"
        codecs: [CVSD]
        url: "https://www.bluetooth.com/specifications/specs/headset-profile-1-2/"
  - name: "LE Audio"
    items:
      - abbr: "BAP"
        version: "1.0.2"
        full: "Basic Audio Profile"
        roles: "Unicast Client & Server, Broadcast Source & Sink"
        codecs: [LC3]
        tag: "experimental"
        note: "streaming endpoints provided by PipeWire"
        url: "https://www.bluetooth.com/specifications/specs/basic-audio-profile-1-0-2/"
      - abbr: "BASS"
        version: "1.0"
        full: "Broadcast Audio Scan Service"
        roles: "Scan Delegator, Broadcast Assistant"
        tag: "experimental"
        url: "https://www.bluetooth.com/specifications/specs/broadcast-audio-scan-service/"
      - abbr: "VCP"
        version: "1.0"
        full: "Volume Control Profile"
        roles: "Controller, Renderer"
        tag: "experimental"
        url: "https://www.bluetooth.com/specifications/specs/volume-control-profile-1-0/"
      - abbr: "MICP"
        version: "1.0"
        full: "Microphone Control Profile"
        roles: "Controller, Device"
        tag: "experimental"
        url: "https://www.bluetooth.com/specifications/specs/microphone-control-profile-1-0/"
      - abbr: "MCP"
        version: "1.0.1"
        full: "Media Control Profile"
        roles: "Client, Server"
        tag: "experimental"
        url: "https://www.bluetooth.com/specifications/specs/media-control-profile/"
      - abbr: "CCP"
        version: "1.0"
        full: "Call Control Profile"
        roles: "Client, Server"
        tag: "testing"
        url: "https://www.bluetooth.com/specifications/specs/call-control-profile-1-0/"
      - abbr: "CSIP"
        version: "1.0"
        full: "Coordinated Set Identification Profile"
        roles: "Set Coordinator, Set Member"
        tag: "experimental"
        url: "https://www.bluetooth.com/specifications/specs/coordinated-set-identification-profile-1-0-1/"
      - abbr: "TMAP"
        version: "1.0"
        full: "Telephony and Media Audio Profile"
        roles: "Client, Server"
        tag: "experimental"
        url: "https://www.bluetooth.com/specifications/specs/telephony-and-media-audio-profile-1-0/"
      - abbr: "GMAP"
        version: "1.0"
        full: "Gaming Audio Profile"
        roles: "Client, Server"
        tag: "experimental"
        url: "https://www.bluetooth.com/specifications/specs/gaming-audio-profile-1-0/"
      - abbr: "ASHA"
        full: "Audio Streaming for Hearing Aids"
        roles: "Source"
        codecs: [G.722]
        tag: "experimental"
        note: "Google specification, not Bluetooth SIG; streamed by PipeWire"
        url: "https://source.android.com/docs/core/connect/bluetooth/asha"
  - name: "Input & GATT services"
    items:
      - abbr: "HID"
        version: "1.1"
        full: "Human Interface Device Profile"
