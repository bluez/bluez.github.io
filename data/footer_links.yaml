columns:
  - heading: "Source"
    description: "BlueZ ships in every major Linux distribution, so most people never need to build it themselves. The userspace source is on GitHub. Kernel changes go through the linux-bluetooth mailing list."
    url: "https://github.com/bluez/bluez"
    link_text: "BlueZ on GitHub"
    icon: "github"
  - heading: "Documentation"
    description: "Reference documentation for the whole stack: the D-Bus APIs, man pages for bluetoothd, bluetoothctl and the other tools, the low level protocol and management references, and the qualification results."
    url: "https://hadess.github.io/bluez/index.html"
    link_text: "Read the BlueZ documentation"
    icon: "book"
  - heading: "Mailing list"
    description: "The parts of the Linux Bluetooth stack are written by many people and it is not the job of just one single person. If you want to get in contact with the developers, please join the developer mailing list and never write to them directly."
    url: "https://subspace.kernel.org/vger.kernel.org.html#linux-bluetooth"
    link_text: "Subscribe to the linux-bluetooth mailing list"
    icon: "mail"
  - heading: "Slack"
    description: "For people who want to use the Linux Bluetooth stack, have problems, basic questions or are looking to develop the platform please join our slack workspace."
    url: "https://join.slack.com/t/bluezorg/shared_invite/zt-opurnyz7-QbHRp5mxxezDcQSQrHFybw"
    link_text: "Join the BlueZ slack workspace"
    icon: "slack"
