<section class="news" id="news">
  <div class="container">
    <h2><a href="{{ "news/" | relURL }}" title="Latest news">Latest news</a></h2>
    <div class="news-grid">
      {{ $news := where .Site.RegularPages "Section" "news" }}
      {{ $news = sort $news "Date" "desc" }}
      {{ range first 3 $news }}
        <article class="news-card">
          <a href="{{ .Permalink }}" title="{{ .Title }}">
          {{ partial "news-card-image.html" . }}
          <h3>{{ .Title }}</h3>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
          <p>{{ .Params.summary }}</p>
          </a>
        </article>
      {{ end }}
    </div>
  </div>
</section>
