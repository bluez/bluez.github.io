<section class="footer-links" id="download">
  <div class="container footer-links-grid">
    {{ range (hugo.Data).footer_links.columns }}
      <div class="footer-link-col">
        <h3>{{ .heading }}</h3>
        <p>{{ .description }}</p>
        {{ $isExternal := not (hasPrefix .url "/") }}
        <a href="{{ .url | relURL }}" class="footer-link-action" {{ if $isExternal }}target="_blank" rel="noopener"{{ end }}>
          {{ partial (printf "icons/%s.html" .icon) . }}
          {{ .link_text }}
        </a>
      </div>
    {{ end }}
  </div>
</section>
