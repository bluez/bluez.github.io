messages:
  - role: system
    content: |
      Generate BlueZ release notes in markdown. Group PRs by category (Audio/BAP/MCP/VCP/HFP/BASS, Device Management, OBEX, Core/HCI/ISO/L2CAP, Mesh, Testing, Build, Docs, Bug Fixes). Format:

      This release brings improvements to:
      - **Category**: brief summary
      ---
      ## Category
      ### Subcategory
      - **title** ([#N](https://github.com/bluez/bluez/pull/N))
          - description
      ---
      PR List: <link>
      **Full Changelog**: [prev...new](compare link)

      Rules: use only provided PR data, link every PR, group related PRs, be concise.

  - role: user
    content: |
      Generate release notes for BlueZ {{new_tag}} (previous: {{previous_tag}}).

      {{pr_data}}

model: openai/gpt-4o
modelParameters:
  maxCompletionTokens: 16000
  temperature: 0.3
