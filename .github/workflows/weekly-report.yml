name: Generate Weekly Report

on:
  # Run every Monday at 08:00 UTC
  schedule:
    - cron: '0 8 * * 1'

  # Allow manual trigger with optional date override
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD), defaults to previous Monday'
        required: false
      end_date:
        description: 'End date (YYYY-MM-DD), defaults to previous Sunday'
        required: false
      model:
        description: 'Unused; retained for compatibility'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine date range
        id: dates
        run: |
          if [ -n "${{ inputs.start_date }}" ] && [ -n "${{ inputs.end_date }}" ]; then
            START="${{ inputs.start_date }}"
            END="${{ inputs.end_date }}"
          else
            # Previous week: Monday to Sunday
            # DOW: 1=Monday ... 7=Sunday
            DOW=$(date +%u)
            # Last Sunday was DOW days ago
            DAYS_TO_SUN=${DOW}
            DAYS_TO_MON=$(( DOW + 6 ))
            START=$(date -d "-${DAYS_TO_MON} days" +%Y-%m-%d)
            END=$(date -d "-${DAYS_TO_SUN} days" +%Y-%m-%d)
          fi

          WEEK_NUM=$(date -d "$START" +%V)
          YEAR=$(date -d "$START" +%G)

          echo "start_date=${START}" >> "$GITHUB_OUTPUT"
          echo "end_date=${END}" >> "$GITHUB_OUTPUT"
          echo "week_num=${WEEK_NUM}" >> "$GITHUB_OUTPUT"
          echo "year=${YEAR}" >> "$GITHUB_OUTPUT"

          echo "Date range: ${START} to ${END} (W${WEEK_NUM}, ${YEAR})"

      - name: Fetch mailing list data
        id: fetch
        run: |
          chmod +x .github/scripts/fetch-lore.sh
          .github/scripts/fetch-lore.sh \
            "${{ steps.dates.outputs.start_date }}" \
            "${{ steps.dates.outputs.end_date }}" \
            > mailing_list_data.txt 2>fetch.log

          cat fetch.log
          echo ""
          echo "Data size: $(wc -l < mailing_list_data.txt) lines, $(wc -c < mailing_list_data.txt) bytes"

          # Fail if no data was collected
          if [ ! -s mailing_list_data.txt ]; then
            echo "::error::No mailing list data collected"
            exit 1
          fi

      - name: Render report
        id: render
        run: |
          chmod +x .github/scripts/render-weekly-report.py
          .github/scripts/render-weekly-report.py \
            < mailing_list_data.txt > report_body.md

          echo "Report size: $(wc -l < report_body.md) lines"

          if [ ! -s report_body.md ]; then
            echo "::error::Report rendering produced no output"
            exit 1
          fi

      - name: Create Hugo post
        id: post
        run: |
          WEEK="${{ steps.dates.outputs.week_num }}"
          YEAR="${{ steps.dates.outputs.year }}"
          END_DATE="${{ steps.dates.outputs.end_date }}"
          POST_DIR="content/news/${YEAR}"
          POST_FILE="${POST_DIR}/weekly-report-w${WEEK}.md"

          mkdir -p "${POST_DIR}"

          # Extract a plain-text summary from the first "Total messages" line
          TOTAL_LINE=$(grep -m1 "^\\*\\*Total messages:" report_body.md || echo "")
          SUMMARY_LINE=$(echo "$TOTAL_LINE" | sed 's/\*\*//g')

          # Build the Hugo post
          cat > "${POST_FILE}" << FRONTMATTER
          ---
          title: "linux-bluetooth Weekly Report - Week ${WEEK}"
          date: ${END_DATE}
          summary: "${SUMMARY_LINE}"
          draft: false
          ---
          FRONTMATTER

          # Remove leading spaces from heredoc
          sed -i 's/^          //' "${POST_FILE}"

          # Append the report body
          echo "" >> "${POST_FILE}"
          cat report_body.md >> "${POST_FILE}"

          echo "post_file=${POST_FILE}" >> "$GITHUB_OUTPUT"
          echo "branch=weekly-report-w${WEEK}-${YEAR}" >> "$GITHUB_OUTPUT"
          echo "week=${WEEK}" >> "$GITHUB_OUTPUT"

          echo "Created: ${POST_FILE}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.post.outputs.branch }}"
          POST_FILE="${{ steps.post.outputs.post_file }}"
          WEEK="${{ steps.post.outputs.week }}"
          START="${{ steps.dates.outputs.start_date }}"
          END="${{ steps.dates.outputs.end_date }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add "${POST_FILE}"

          # A re-run for a week that is already published produces an
          # identical file, since rendering is deterministic.
          if git diff --cached --quiet; then
            echo "Report for week ${WEEK} is unchanged; nothing to do."
            exit 0
          fi

          git commit -m "Add weekly report for Week ${WEEK} (${START} to ${END})"
          git push --force origin "${BRANCH}"

          # Reuse the existing PR for this branch if one is already open.
          if gh pr view "${BRANCH}" --json number >/dev/null 2>&1; then
            echo "Pull request for ${BRANCH} already exists; branch updated."
            exit 0
          fi

          gh pr create \
            --title "Add weekly report for Week ${WEEK} (${START} to ${END})" \
            --body "$(cat <<EOF
          ## Weekly Report - Week ${WEEK}

          Auto-generated weekly report for the linux-bluetooth mailing list.

          - **Period**: ${START} to ${END}
          - **Generated by**: .github/scripts/render-weekly-report.py (deterministic)
          - **Data source**: lore.kernel.org/linux-bluetooth

          > **Note**: This report is generated deterministically from the
          > lore.kernel.org archive. Every figure and link is derived from the
          > fetched data, but a quick review before merging is still advised.
          EOF
          )" \
            --base main \
            --head "${BRANCH}"
