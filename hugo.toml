baseURL = 'https://bluez.org/'
languageCode = 'en-us'
title = 'BlueZ - Official Linux Bluetooth Protocol Stack'

[params]
  description = 'BlueZ is the official Linux Bluetooth protocol stack. Part of the mainline kernel, it supports Classic Bluetooth and Low Energy with D-Bus and socket APIs.'
  copyrightYearStart = 2000
  defaultNewsImage = 'images/news/bluetooth-hardware.png'
  # Ordered card images for weekly reports; image index = (week number - 1) modulo list length.
  weeklyReportImages = [
    'images/news/mailing-list-1.png',
    'images/news/mailing-list-2.png',
    'images/news/mailing-list-3.png',
  ]

[pagination]
  pagerSize = 12

[taxonomies]

[markup]
  [markup.highlight]
    codeFences = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
